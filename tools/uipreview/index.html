<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex Turismo — UI Preview</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0a0a0c;
        overflow: hidden;
        height: 100%;
      }
      #toolbar {
        height: 34px;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0 8px;
        background: #1a1a1e;
        border-bottom: 1px solid #333;
        overflow-x: auto;
        white-space: nowrap;
      }
      #toolbar button {
        font-family: monospace;
        font-size: 11px;
        background: #2a2a30;
        color: #ddd;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 3px 8px;
        cursor: pointer;
      }
      #toolbar button:hover {
        background: #3a3a42;
        color: #fff;
      }
      #stage {
        position: relative;
        width: 100vw;
        height: calc(100vh - 34px);
        background: radial-gradient(ellipse at 70% 50%, #23262e 0%, #0a0a0c 70%);
        overflow: hidden;
      }
      #showroom-label {
        position: absolute;
        top: 50%;
        right: 8%;
        transform: translateY(-50%);
        font-family: 'Inter', Arial, sans-serif;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        opacity: 0.5;
        text-align: right;
        max-width: 40%;
      }
      #ui-root {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="toolbar"></div>
    <div id="stage">
      <div id="showroom-label"></div>
      <div id="ui-root"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
