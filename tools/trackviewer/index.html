<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Track Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        overflow: hidden;
        font-family: sans-serif;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
      }
      #hud {
        position: absolute;
        top: 8px;
        left: 8px;
        color: #eee;
        background: rgba(0, 0, 0, 0.55);
        padding: 8px 10px;
        font-size: 12px;
        line-height: 1.5;
        border-radius: 4px;
        z-index: 10;
      }
      #hud button {
        margin-right: 6px;
        margin-top: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud">
        <div id="stats">loading...</div>
        <div>
          <button id="btn-start">Start line</button>
          <button id="btn-overhead">Overhead</button>
          <button id="btn-line">Toggle racing line</button>
        </div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
